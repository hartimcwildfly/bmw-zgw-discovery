name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [win, linux, linux-musl, osx]
        architecture: [x64, arm64]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0
    - name: Build
      run: dotnet publish -c Release -r ${{ matrix.os }}-${{ matrix.architecture }}
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.architecture }}
        path: ./bin/Release/net10.0/${{ matrix.os }}-${{ matrix.architecture }}/publish/BmwDiscovery*
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      if: matrix.os == 'linux-musl' && matrix.architecture == 'x64'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build Docker Image
      run: docker build -f ./Dockerfile -t docker.io/hartimcwildfly/bmw-zgw-discovery ./bin/Release/net10.0/${{ matrix.os }}-${{ matrix.architecture }}/publish/ && docker push docker.io/hartimcwildfly/bmw-zgw-discovery
      if: matrix.os == 'linux-musl' && matrix.architecture == 'x64'
